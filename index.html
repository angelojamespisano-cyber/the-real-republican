<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Real Republican</title>
  <meta name="description" content="Angelo's daily political news digest">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Real Republican">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <button id="back" class="icon-btn back-btn" aria-label="Back to headlines" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <div class="titles">
        <p class="kicker">The Real Republican</p>
        <h1 id="digest-date">Loading&hellip;</h1>
      </div>
      <button id="refresh" class="icon-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
    <p id="meta" class="meta"></p>
  </header>

  <main id="feed" class="feed" aria-live="polite"></main>
  <article id="story" class="story" hidden></article>

  <footer class="foot">
    <p>Story write-ups are our own summaries of the original reporting; each links to the original article. Images &amp; video &copy; their publishers.</p>
  </footer>

  <template id="card-tpl">
    <article class="card">
      <div class="media">
        <a class="media-link">
          <img class="lead" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">
        </a>
        <button class="play" hidden aria-label="Play video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        <span class="rank"></span>
      </div>
      <div class="body">
        <p class="byline"><span class="source"></span><span class="dot">&middot;</span><time class="time"></time></p>
        <h2 class="headline"><a></a></h2>
        <p class="note"></p>
        <div class="actions">
          <a class="btn read">Read full story</a>
          <a class="btn watch" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            Watch video
          </a>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
